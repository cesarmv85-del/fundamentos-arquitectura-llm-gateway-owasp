<text x="600" y="940" font-family="DejaVu Sans" font-size="18" fill="#1E2761" font-weight="bold" text-anchor="start">Por qué así:</text>
<text x="600" y="972" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">• Varias réplicas exigen un contador compartido (Redis); con memory:// cada réplica tendría su propia cuota.</text>
<text x="600" y="1002" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">• Las keys se montan como archivos (*_FILE): no viven en variables de entorno ni en la imagen.</text>
<text x="600" y="1032" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">• El WAF limita por IP como primera capa; el gateway limita por clave, que es lo que controla el costo.</text>
