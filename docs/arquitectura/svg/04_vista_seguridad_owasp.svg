<text x="1455" y="166" font-family="DejaVu Sans" font-size="28" fill="#fff" font-weight="bold" text-anchor="start">LLM10</text>
<text x="1455" y="195" font-family="DejaVu Sans" font-size="18" fill="#fff" font-weight="normal" text-anchor="start">Unbounded Consumption</text>
<text x="1455" y="240" font-family="DejaVu Sans" font-size="14" fill="#1E8449" font-weight="bold" text-anchor="start">AMENAZA (caso de la Fase 1)</text>
<text x="1455" y="272" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Una app con bug o un abusador dispara miles</text>
<text x="1455" y="296" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">de llamadas o pide max_tokens = 50 000.</text>
<text x="1455" y="340" font-family="DejaVu Sans" font-size="14" fill="#1E8449" font-weight="bold" text-anchor="start">CONTROLES</text>
<circle cx="1463" cy="366" r="5" fill="#1E8449"/><text x="1477" y="372" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Rate limit por cliente_id (slowapi)</text>
<circle cx="1463" cy="398" r="5" fill="#1E8449"/><text x="1477" y="404" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Techo max_tokens ≤ 512</text>
<circle cx="1463" cy="430" r="5" fill="#1E8449"/><text x="1477" y="436" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Mensaje ≤ 4000 · body ≤ 16 KB</text>
<circle cx="1463" cy="462" r="5" fill="#1E8449"/><text x="1477" y="468" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Timeout upstream 20 s</text>
<circle cx="1463" cy="494" r="5" fill="#1E8449"/><text x="1477" y="500" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Contador en Redis con réplicas</text>
<text x="1455" y="548" font-family="DejaVu Sans" font-size="14" fill="#1E8449" font-weight="bold" text-anchor="start">MÓDULO</text>
<text x="1455" y="576" font-family="DejaVu Sans Mono" font-size="15" fill="#1f2433" font-weight="normal" text-anchor="start">main.py · config.py</text>
<text x="1455" y="620" font-family="DejaVu Sans" font-size="14" fill="#1E8449" font-weight="bold" text-anchor="start">EVIDENCIA ANTES / DESPUÉS</text>
<text x="1455" y="646" font-family="DejaVu Sans Mono" font-size="14" fill="#1f2433" font-weight="normal" text-anchor="start">test_llm10_rate_limit.py</text>
