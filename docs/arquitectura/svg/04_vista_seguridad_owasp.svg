<text x="69" y="166" font-family="DejaVu Sans" font-size="28" fill="#fff" font-weight="bold" text-anchor="start">LLM01</text>
<text x="69" y="195" font-family="DejaVu Sans" font-size="18" fill="#fff" font-weight="normal" text-anchor="start">Prompt Injection</text>
<text x="69" y="240" font-family="DejaVu Sans" font-size="14" fill="#C0392B" font-weight="bold" text-anchor="start">AMENAZA (caso de la Fase 1)</text>
<text x="69" y="272" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Un cliente reescribe la política de negocio</text>
<text x="69" y="296" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">(&quot;devoluciones en 365 días&quot;) o la oculta con</text>
<text x="69" y="320" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">caracteres invisibles.</text>
<text x="69" y="364" font-family="DejaVu Sans" font-size="14" fill="#C0392B" font-weight="bold" text-anchor="start">CONTROLES</text>
<circle cx="77" cy="390" r="5" fill="#C0392B"/><text x="91" y="396" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Normalización NFKC + quita invisibles</text>
<circle cx="77" cy="422" r="5" fill="#C0392B"/><text x="91" y="428" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Detección con puntaje ES/EN</text>
<circle cx="77" cy="454" r="5" fill="#C0392B"/><text x="91" y="460" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Neutralización de delimitadores</text>
<circle cx="77" cy="486" r="5" fill="#C0392B"/><text x="91" y="492" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Encapsulado + instrucción de dato</text>
<circle cx="77" cy="518" r="5" fill="#C0392B"/><text x="91" y="524" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Rechazo 400 antes de gastar tokens</text>
<text x="69" y="572" font-family="DejaVu Sans" font-size="14" fill="#C0392B" font-weight="bold" text-anchor="start">MÓDULO</text>
<text x="69" y="600" font-family="DejaVu Sans Mono" font-size="15" fill="#1f2433" font-weight="normal" text-anchor="start">sanitizacion.py</text>
<text x="69" y="644" font-family="DejaVu Sans" font-size="14" fill="#C0392B" font-weight="bold" text-anchor="start">EVIDENCIA ANTES / DESPUÉS</text>
<text x="69" y="670" font-family="DejaVu Sans Mono" font-size="14" fill="#1f2433" font-weight="normal" text-anchor="start">test_llm01_prompt_injection.py</text>
<text x="69" y="696" font-family="DejaVu Sans Mono" font-size="14" fill="#1f2433" font-weight="normal" text-anchor="start">test_sanitizacion.py (25 casos)</text>
<rect x="61" y="718" width="408" height="156" rx="10" fill="#FBE9E7"/>
<text x="75" y="744" font-family="DejaVu Sans" font-size="14" fill="#C0392B" font-weight="bold" text-anchor="start">RIESGO RESIDUAL</text>
<text x="75" y="768" font-family="DejaVu Sans" font-size="15" fill="#1f2433" font-weight="normal" text-anchor="start">Paráfrasis e inyección indirecta → 2ª</text>
<text x="75" y="792" font-family="DejaVu Sans" font-size="15" fill="#1f2433" font-weight="normal" text-anchor="start">línea en LLM07</text>
<rect x="507" y="130" width="440" height="760" rx="16" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.5"/>
<rect x="507" y="130" width="440" height="78" rx="16" fill="#B7791F"/><rect x="507" y="180" width="440" height="28" fill="#B7791F"/>
<text x="531" y="166" font-family="DejaVu Sans" font-size="28" fill="#fff" font-weight="bold" text-anchor="start">LLM02</text>
<text x="531" y="195" font-family="DejaVu Sans" font-size="18" fill="#fff" font-weight="normal" text-anchor="start">Sensitive Info Disclosure</text>
<text x="531" y="240" font-family="DejaVu Sans" font-size="14" fill="#B7791F" font-weight="bold" text-anchor="start">AMENAZA (caso de la Fase 1)</text>
<text x="531" y="272" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">La key del proveedor llega al cliente en un</text>
<text x="531" y="296" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">error; el log guarda prompts con PII y la</text>
<text x="531" y="320" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">clave del cliente.</text>
<text x="531" y="364" font-family="DejaVu Sans" font-size="14" fill="#B7791F" font-weight="bold" text-anchor="start">CONTROLES</text>
<circle cx="539" cy="390" r="5" fill="#B7791F"/><text x="553" y="396" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">SecretStr + *_FILE (Secret Manager)</text>
<circle cx="539" cy="422" r="5" fill="#B7791F"/><text x="553" y="428" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Claves de cliente solo como SHA-256</text>
<circle cx="539" cy="454" r="5" fill="#B7791F"/><text x="553" y="460" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Key de Gemini en cabecera, no en URL</text>
<circle cx="539" cy="486" r="5" fill="#B7791F"/><text x="553" y="492" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Errores genéricos + request_id</text>
<circle cx="539" cy="518" r="5" fill="#B7791F"/><text x="553" y="524" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Logs: allowlist + redacción</text>
<text x="531" y="572" font-family="DejaVu Sans" font-size="14" fill="#B7791F" font-weight="bold" text-anchor="start">MÓDULO</text>
<text x="531" y="600" font-family="DejaVu Sans Mono" font-size="15" fill="#1f2433" font-weight="normal" text-anchor="start">config · auth · logging_seguro</text>
<text x="531" y="644" font-family="DejaVu Sans" font-size="14" fill="#B7791F" font-weight="bold" text-anchor="start">EVIDENCIA ANTES / DESPUÉS</text>
<text x="531" y="670" font-family="DejaVu Sans Mono" font-size="14" fill="#1f2433" font-weight="normal" text-anchor="start">test_llm02_credenciales.py</text>
<text x="531" y="696" font-family="DejaVu Sans Mono" font-size="14" fill="#1f2433" font-weight="normal" text-anchor="start">escanear_secretos.py (git + logs)</text>
<rect x="523" y="718" width="408" height="156" rx="10" fill="#FDF3E1"/>
<text x="537" y="744" font-family="DejaVu Sans" font-size="14" fill="#B7791F" font-weight="bold" text-anchor="start">RIESGO RESIDUAL</text>
<text x="537" y="768" font-family="DejaVu Sans" font-size="15" fill="#1f2433" font-weight="normal" text-anchor="start">Metadatos (longitud, tiempos) aún son</text>
<text x="537" y="792" font-family="DejaVu Sans" font-size="15" fill="#1f2433" font-weight="normal" text-anchor="start">observables</text>
<rect x="969" y="130" width="440" height="760" rx="16" fill="#FFFFFF" stroke="#7D3C98" stroke-width="2.5"/>
<rect x="969" y="130" width="440" height="78" rx="16" fill="#7D3C98"/><rect x="969" y="180" width="440" height="28" fill="#7D3C98"/>
<text x="993" y="166" font-family="DejaVu Sans" font-size="28" fill="#fff" font-weight="bold" text-anchor="start">LLM07</text>
<text x="993" y="195" font-family="DejaVu Sans" font-size="18" fill="#fff" font-weight="normal" text-anchor="start">System Prompt Leakage</text>
<text x="993" y="240" font-family="DejaVu Sans" font-size="14" fill="#7D3C98" font-weight="bold" text-anchor="start">AMENAZA (caso de la Fase 1)</text>
<text x="993" y="272" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">El atacante obtiene las reglas internas y</text>
<text x="993" y="296" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">aprende exactamente qué debe evadir.</text>
<text x="993" y="340" font-family="DejaVu Sans" font-size="14" fill="#7D3C98" font-weight="bold" text-anchor="start">CONTROLES</text>
<circle cx="1001" cy="366" r="5" fill="#7D3C98"/><text x="1015" y="372" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">System prompt sin secretos</text>
<circle cx="1001" cy="398" r="5" fill="#7D3C98"/><text x="1015" y="404" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Token canario aleatorio por arranque</text>
<circle cx="1001" cy="430" r="5" fill="#7D3C98"/><text x="1015" y="436" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Detector de 8-gramas en la salida</text>
<circle cx="1001" cy="462" r="5" fill="#7D3C98"/><text x="1015" y="468" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">Respuesta reemplazada si hay fuga</text>
<circle cx="1001" cy="494" r="5" fill="#7D3C98"/><text x="1015" y="500" font-family="DejaVu Sans" font-size="16" fill="#1f2433" font-weight="normal" text-anchor="start">El canario nunca se loguea</text>
<text x="993" y="548" font-family="DejaVu Sans" font-size="14" fill="#7D3C98" font-weight="bold" text-anchor="start">MÓDULO</text>
<text x="993" y="576" font-family="DejaVu Sans Mono" font-size="15" fill="#1f2433" font-weight="normal" text-anchor="start">salida.py</text>
<text x="993" y="620" font-family="DejaVu Sans" font-size="14" fill="#7D3C98" font-weight="bold" text-anchor="start">EVIDENCIA ANTES / DESPUÉS</text>
<text x="993" y="646" font-family="DejaVu Sans Mono" font-size="14" fill="#1f2433" font-weight="normal" text-anchor="start">test_llm07_fuga_system_prompt.py</text>
<text x="993" y="672" font-family="DejaVu Sans Mono" font-size="14" fill="#1f2433" font-weight="normal" text-anchor="start">(demo con LLM01 apagado)</text>
<rect x="985" y="694" width="408" height="180" rx="10" fill="#F4EAF8"/>
<text x="999" y="720" font-family="DejaVu Sans" font-size="14" fill="#7D3C98" font-weight="bold" text-anchor="start">RIESGO RESIDUAL</text>
<text x="999" y="744" font-family="DejaVu Sans" font-size="15" fill="#1f2433" font-weight="normal" text-anchor="start">La paráfrasis no se detecta → no guardar</text>
<text x="999" y="768" font-family="DejaVu Sans" font-size="15" fill="#1f2433" font-weight="normal" text-anchor="start">secretos ahí</text>
