<rect x="1010" y="564" width="110" height="88" rx="10" fill="#B7791F"/>
<text x="1065" y="618" font-family="DejaVu Sans" font-size="28" fill="#fff" font-weight="bold" text-anchor="middle">503</text>
<text x="1140" y="598" font-family="DejaVu Sans Mono" font-size="16" fill="#1f2433" font-weight="bold" text-anchor="start">no_disponible (5xx, conexión)</text>
<text x="1140" y="628" font-family="DejaVu Sans" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">Servicio de IA no disponible temporalmente.</text>
<rect x="1010" y="668" width="840" height="88" rx="10" fill="#FFFFFF" stroke="#dde2ee"/>
<rect x="1010" y="668" width="110" height="88" rx="10" fill="#B7791F"/>
