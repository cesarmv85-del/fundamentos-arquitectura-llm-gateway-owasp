<rect x="70" y="288" width="8" height="84" rx="3" fill="#B7791F"/>
<text x="92" y="320" font-family="DejaVu Sans" font-size="20" fill="#1f2433" font-weight="bold" text-anchor="start">Barrera 1 · Allowlist</text>
<text x="92" y="350" font-family="DejaVu Sans" font-size="15" fill="#3a4254" font-weight="normal" text-anchor="start">campo ∉ CAMPOS_PERMITIDOS → se descarta</text>
<line x1="490" y1="372" x2="490" y2="394" stroke="#1E2761" stroke-width="3" marker-end="url(#m1E2761)"/>
<rect x="70" y="396" width="840" height="84" rx="12" fill="#FFFFFF" stroke="#B7791F" stroke-width="2"/>
<rect x="70" y="396" width="8" height="84" rx="3" fill="#B7791F"/>
<text x="92" y="428" font-family="DejaVu Sans" font-size="20" fill="#1f2433" font-weight="bold" text-anchor="start">Barrera 2 · Redacción</text>
<text x="92" y="458" font-family="DejaVu Sans" font-size="15" fill="#3a4254" font-weight="normal" text-anchor="start">sk-… · sk-ant-… · AIza… · gw_… · Bearer … · ?key= · correos → [REDACTADO]</text>
<line x1="490" y1="480" x2="490" y2="502" stroke="#1E2761" stroke-width="3" marker-end="url(#m1E2761)"/>
<rect x="70" y="504" width="840" height="84" rx="12" fill="#FFFFFF" stroke="#2F6FDE" stroke-width="2"/>
<rect x="70" y="504" width="8" height="84" rx="3" fill="#2F6FDE"/>
<text x="92" y="536" font-family="DejaVu Sans" font-size="20" fill="#1f2433" font-weight="bold" text-anchor="start">Línea JSON</text>
<text x="92" y="566" font-family="DejaVu Sans" font-size="15" fill="#3a4254" font-weight="normal" text-anchor="start">stdout + logs/gateway.jsonl → SIEM / Cloud Logging</text>
<rect x="70" y="630" width="405" height="330" rx="12" fill="#FFFFFF" stroke="#1E8449" stroke-width="2"/>
<rect x="70" y="630" width="8" height="330" rx="3" fill="#1E8449"/>
<text x="92" y="662" font-family="DejaVu Sans" font-size="20" fill="#1f2433" font-weight="bold" text-anchor="start">SÍ se registra</text>
<text x="92" y="693" font-family="DejaVu Sans Mono" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">timestamp · nivel · evento</text>
<text x="92" y="716" font-family="DejaVu Sans Mono" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">request_id · endpoint · método</text>
<text x="92" y="739" font-family="DejaVu Sans Mono" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">estado_http · resultado</text>
<text x="92" y="762" font-family="DejaVu Sans Mono" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">latencia_ms</text>
<text x="92" y="785" font-family="DejaVu Sans Mono" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">cliente_id (nombre#hash)</text>
<text x="92" y="808" font-family="DejaVu Sans Mono" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">proveedor · modelo · tokens</text>
<text x="92" y="831" font-family="DejaVu Sans Mono" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">longitud_mensaje</text>
<text x="92" y="854" font-family="DejaVu Sans Mono" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">categorias_bloqueo</text>
<text x="92" y="877" font-family="DejaVu Sans Mono" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">puntaje_inyeccion · motivo_fuga</text>
<text x="92" y="900" font-family="DejaVu Sans Mono" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">tipo_error · degradado</text>
<rect x="505" y="630" width="405" height="330" rx="12" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
<rect x="505" y="630" width="8" height="330" rx="3" fill="#C0392B"/>
<text x="527" y="662" font-family="DejaVu Sans" font-size="20" fill="#1f2433" font-weight="bold" text-anchor="start">NUNCA se registra</text>
<text x="527" y="693" font-family="DejaVu Sans" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">Prompt del usuario</text>
<text x="527" y="716" font-family="DejaVu Sans" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">  → puede traer PII</text>
<text x="527" y="739" font-family="DejaVu Sans" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">Respuesta del modelo</text>
<text x="527" y="762" font-family="DejaVu Sans" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">Cabeceras (Authorization)</text>
<text x="527" y="785" font-family="DejaVu Sans" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">  → credencial reutilizable</text>
<text x="527" y="808" font-family="DejaVu Sans" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">API keys / claves gw_</text>
<text x="527" y="831" font-family="DejaVu Sans" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">System prompt y canario</text>
<text x="527" y="854" font-family="DejaVu Sans" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">  → anularía LLM07</text>
<text x="527" y="877" font-family="DejaVu Sans" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">Detalle de errores upstream</text>
<text x="527" y="900" font-family="DejaVu Sans" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">  → URLs con ?key=</text>
<rect x="70" y="980" width="840" height="90" rx="12" fill="#FFFFFF" stroke="#1E8449" stroke-width="2"/>
<rect x="70" y="980" width="8" height="90" rx="3" fill="#1E8449"/>
<text x="92" y="1012" font-family="DejaVu Sans" font-size="20" fill="#1f2433" font-weight="bold" text-anchor="start">Para depurar basta con</text>
<text x="92" y="1042" font-family="DejaVu Sans" font-size="15" fill="#3a4254" font-weight="normal" text-anchor="start">request_id + longitud_mensaje + tipo_error + categorias_bloqueo (sin ver el contenido)</text>
<rect x="980" y="130" width="900" height="960" rx="18" fill="#EEF2FB" stroke="#1E2761" stroke-width="2"/><text x="1000" y="160" font-family="DejaVu Sans" font-size="19" fill="#1E2761" font-weight="bold" text-anchor="start">Degradación controlada ante fallos upstream</text>
<rect x="1010" y="180" width="840" height="84" rx="12" fill="#FFFFFF" stroke="#6b7280" stroke-width="2"/>
<rect x="1010" y="180" width="8" height="84" rx="3" fill="#6b7280"/>
<text x="1032" y="212" font-family="DejaVu Sans" font-size="20" fill="#1f2433" font-weight="bold" text-anchor="start">proveedores.completar_con_respaldo()</text>
<text x="1032" y="242" font-family="DejaVu Sans" font-size="15" fill="#3a4254" font-weight="normal" text-anchor="start">Todo error de red/HTTP se convierte en ErrorProveedor(tipo) · detalle interno nunca sale</text>
