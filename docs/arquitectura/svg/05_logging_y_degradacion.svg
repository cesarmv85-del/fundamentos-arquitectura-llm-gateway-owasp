<rect width="1920" height="8" fill="#1E2761"/>
<text x="60" y="62" font-family="DejaVu Sans" font-size="36" fill="#1E2761" font-weight="bold" text-anchor="start">5 · Logging seguro y degradación controlada</text>
<text x="60" y="96" font-family="DejaVu Sans" font-size="19" fill="#5d6780" font-weight="normal" text-anchor="start">Requisitos no funcionales: auditoría sin fugas y errores claros sin trazas internas</text>
<text x="1860" y="62" font-family="DejaVu Sans" font-size="16" fill="#5d6780" font-weight="normal" text-anchor="end">Gateway LLM · Arquitectura · Logging y resiliencia</text>
<text x="1860" y="86" font-family="DejaVu Sans" font-size="14" fill="#5d6780" font-weight="normal" text-anchor="end">Proyecto Final Opción 4 · Fundamentos de Arquitectura LLM</text>
<rect x="40" y="130" width="900" height="960" rx="18" fill="#FFFBF3" stroke="#B7791F" stroke-width="2"/><text x="60" y="160" font-family="DejaVu Sans" font-size="19" fill="#B7791F" font-weight="bold" text-anchor="start">Logging estructurado seguro (LLM02)</text>
<rect x="70" y="180" width="840" height="84" rx="12" fill="#FFFFFF" stroke="#6b7280" stroke-width="2"/>
<rect x="70" y="180" width="8" height="84" rx="3" fill="#6b7280"/>
<text x="92" y="212" font-family="DejaVu Sans" font-size="20" fill="#1f2433" font-weight="bold" text-anchor="start">Evento de auditoría</text>
<text x="92" y="242" font-family="DejaVu Sans" font-size="15" fill="#3a4254" font-weight="normal" text-anchor="start">middleware · registrar(&quot;solicitud&quot;, **campos)</text>
<line x1="490" y1="264" x2="490" y2="286" stroke="#1E2761" stroke-width="3" marker-end="url(#m1E2761)"/>
