<text x="1667" y="372" font-family="DejaVu Sans" font-size="13" fill="#3a4254" font-weight="normal" text-anchor="start">proveedor_fallido en log</text>
<line x1="1430" y1="402" x2="1430" y2="450" stroke="#1E2761" stroke-width="3" marker-end="url(#m1E2761)"/><text x="1442.0" y="418.0" font-family="DejaVu Sans" font-size="14" fill="#5d6780" font-weight="normal" text-anchor="start">no / también falla</text>
