<text x="1140" y="702" font-family="DejaVu Sans Mono" font-size="16" fill="#1f2433" font-weight="bold" text-anchor="start">saturado (429 del proveedor)</text>
<text x="1140" y="732" font-family="DejaVu Sans" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">Proveedor saturado. Intente en un minuto.</text>
