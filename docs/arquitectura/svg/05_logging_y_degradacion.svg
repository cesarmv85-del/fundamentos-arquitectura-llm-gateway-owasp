<text x="1140" y="910" font-family="DejaVu Sans Mono" font-size="16" fill="#1f2433" font-weight="bold" text-anchor="start">excepción no prevista</text>
<text x="1140" y="940" font-family="DejaVu Sans" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">Error interno genérico (middleware de auditoría).</text>
