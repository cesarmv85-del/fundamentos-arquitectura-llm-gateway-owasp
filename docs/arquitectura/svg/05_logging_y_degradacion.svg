<text x="1140" y="494" font-family="DejaVu Sans Mono" font-size="16" fill="#1f2433" font-weight="bold" text-anchor="start">timeout</text>
<text x="1140" y="524" font-family="DejaVu Sans" font-size="16" fill="#3a4254" font-weight="normal" text-anchor="start">El proveedor no respondió a tiempo. Intente en unos segundos.</text>
