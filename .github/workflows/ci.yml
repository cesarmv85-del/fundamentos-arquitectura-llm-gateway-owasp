name: Pruebas y secretos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest   # máquina de prueba Linux de GitHub
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: el escáner revisa todos los commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar con el mismo instalador del manual (incluye 63 pruebas y escáner de secretos)
        run: bash scripts/instalar.sh
      - name: Prueba de humo — arrancar el gateway y hacer solicitudes reales
        run: bash scripts/prueba_humo.sh
      - name: Evidencia antes/después de cada mitigación
        run: venv/bin/python scripts/demo_antes_despues.py
