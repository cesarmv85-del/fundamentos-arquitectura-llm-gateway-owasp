name: Pruebas y secretos

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: el escáner revisa todos los commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas antes/después (63)
        run: python -m pytest -v
      - name: Escáner de secretos (código + historial git)
        run: python scripts/escanear_secretos.py
